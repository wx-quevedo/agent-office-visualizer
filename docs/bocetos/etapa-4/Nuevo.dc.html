<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nuevo proyecto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D4FAF}a:hover{color:#123A85}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #F4F5F7; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #1F2329; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 8px 4px; display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" style="height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 17px; text-decoration: none">Cancelar</a>
    <div style="font-size: 17px; font-weight: 600">Nuevo proyecto</div>
    <span style="width: 80px"></span>
  </div>
  <div style="flex: 1; padding: 6px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <label for="nombre" style="font-size: 12px; font-weight: 600; color: #4A505C">NOMBRE</label>
      <input id="nombre" value="landing-inmersoft" style="height: 40px; border: 1px solid #D5D9DF; border-radius: 9px; padding: 0 12px; font-family: inherit; font-size: 16px; color: #1F2329">
      <div style="font-family: ui-monospace, 'SF Mono', monospace; font-size: 12px; color: #4A505C">E:\Agents\landing-inmersoft</div>
    </div>
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 12px; font-weight: 600; color: #4A505C">DÓNDE Y CON QUÉ CUENTA</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="min-height: 52px; border: 2px solid #1D4FAF; border-radius: 10px; background: #E3ECFB; font-family: inherit; text-align: left; padding: 6px 10px; color: #1F2329"><span style="display: block; font-size: 15px; font-weight: 600">Alienware</span><span style="font-size: 12px; color: #2F5C45">Encendida</span></button>
        <button style="min-height: 52px; border: 1px solid #D5D9DF; border-radius: 10px; background: #FFFFFF; font-family: inherit; text-align: left; padding: 6px 10px; color: #1F2329"><span style="display: block; font-size: 15px; font-weight: 600">MacBook</span><span style="font-size: 12px; color: #4A505C">Sin monitor todavía</span></button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E4E7EB; border-radius: 9px; padding: 2px">
        <button style="height: 34px; border: none; border-radius: 7px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #1F2329">Personal</button>
        <button style="height: 34px; border: none; border-radius: 7px; background: transparent; font-family: inherit; font-size: 14px; color: #2B2F36">Demo Org</button>
      </div>
    </div>
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 600; color: #4A505C">PLANTILLA</div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{plantillas}}" as="t" hint-placeholder-count="4">
          <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 14px">{{t.n}}</button>
        </sc-for>
      </div>
    </div>
    <div style="background: #FFFFFF; border-radius: 14px; overflow: hidden">
      <div style="padding: 12px 14px 4px; font-size: 12px; font-weight: 600; color: #4A505C">EQUIPO</div>
      <sc-for list="{{equipo}}" as="e" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: {{e.borde}}">
          <span style="width: 36px; height: 36px; border-radius: 18px; background: {{e.color}}; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{e.ini}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 600">{{e.rol}}</span>
            <span style="font-size: 13px; color: #4A505C">{{e.modelo}}</span>
          </span>
          <button aria-label="Cambiar modelo y esfuerzo" style="width: 44px; height: 44px; border: none; background: transparent">
            <svg width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6" stroke="#9AA0AA" stroke-width="1.8" fill="none"></path></svg>
          </button>
        </div>
      </sc-for>
      <button style="width: 100%; height: 44px; border: none; border-top: 1px solid #EEF0F3; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #1D4FAF; text-align: left; padding: 0 14px">Agregar otro agente de código</button>
    </div>
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px">Aprobar órdenes automáticamente</span>
        <span style="font-size: 12px; color: #4A505C">Apagado: apruebas cada orden del orquestador al agente.</span>
      </span>
      <button role="switch" aria-checked="false" aria-label="Aprobar órdenes automáticamente" style="width: 51px; height: 31px; border: none; padding: 0; border-radius: 16px; background: #C9CDD3; position: relative; flex-shrink: 0"><span style="position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF"></span></button>
    </div>
  </div>
  <div style="padding: 12px 16px 34px">
    <a href="Chat.dc.html" style="height: 52px; border-radius: 14px; background: #1D4FAF; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">Crear y empezar la entrevista</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { bd: '#1D4FAF', bg: '#1D4FAF', fg: '#FFFFFF' };
    const off = { bd: '#D5D9DF', bg: '#FFFFFF', fg: '#1F2329' };
    return {
      plantillas: [
        Object.assign({ n: 'Web (Next.js)' }, on),
        Object.assign({ n: 'Unity' }, off),
        Object.assign({ n: 'App (Expo)' }, off),
        Object.assign({ n: 'Vacía' }, off)
      ],
      equipo: [
        { ini: 'OR', rol: 'Orquestador', modelo: 'Opus 5.5 · esfuerzo alto', color: '#5B3FA8', borde: 'none' },
        { ini: 'AC', rol: 'Agente de código', modelo: 'Sonnet 5.5 · esfuerzo medio', color: '#2B2F36', borde: '1px solid #EEF0F3' }
      ]
    };
  }
}
</script>
</body>
</html>
