<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reglas de la casa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D4FAF}a:hover{color:#123A85}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #F4F5F7; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #1F2329; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 54px 8px 0; display: flex; align-items: center; gap: 4px">
    <a href="Equipo.dc.html" aria-label="Volver al equipo" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="10" height="18" viewBox="0 0 10 18" aria-hidden="true"><path d="M9 1L1 9l8 8" stroke="#1D4FAF" stroke-width="2" fill="none"></path></svg></a>
    <span style="flex: 1; font-size: 17px; font-weight: 600">Reglas de la casa</span>
    <button style="height: 44px; padding: 0 10px; border: none; background: transparent; font-family: inherit; font-size: 17px; color: #1D4FAF">Agregar</button>
  </div>
  <div style="padding: 4px 16px 10px; font-size: 14px; color: #4A505C; line-height: 1.4">Todos los orquestadores las heredan al crear un proyecto. Puedes apagar una solo para landing-inmersoft.</div>
  <div style="flex: 1; padding: 0 16px; overflow: hidden">
    <div style="background: #FFFFFF; border-radius: 14px; overflow: hidden">
      <sc-for list="{{reglas}}" as="r" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: {{r.borde}}">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; line-height: 1.3">{{r.texto}}</span>
            <span style="font-size: 12px; color: #4A505C">{{r.tipo}}</span>
          </span>
          <button role="switch" aria-checked="{{r.on}}" aria-label="Aplicar en este proyecto" style="width: 51px; height: 31px; border: none; padding: 0; border-radius: 16px; background: {{r.fondo}}; position: relative; flex-shrink: 0"><span style="position: absolute; left: {{r.pos}}; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF"></span></button>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="padding: 12px 16px 34px; font-size: 13px; color: #4A505C; text-align: center">Los cambios se editan también desde la web, en Ajustes.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = { on: 'true', fondo: '#2F5C45', pos: '22px' };
    const off = { on: 'false', fondo: '#C9CDD3', pos: '2px' };
    const r = (texto, tipo, s, i) => Object.assign({ texto, tipo, borde: i === 0 ? 'none' : '1px solid #EEF0F3' }, s);
    const lista = [
      ['Escribir en español latino neutro', 'Idioma', on],
      ['Sin emojis en interfaces, código ni documentos', 'Estilo', on],
      ['Tema claro por defecto', 'Diseño', on],
      ['Commits solo a mi nombre, sin coautor ni push', 'Git', on],
      ['Mantener PROJECT.md con decisiones y avance', 'Documentación', on],
      ['Estimar tiempo y dificultad antes de cada orden', 'Órdenes', on],
      ['Cerrar cada entrega con el resumen de 5 líneas', 'Órdenes', on],
      ['Instalar skills con npx autoskills al empezar', 'Configuración', off],
      ['Usar subagentes para pruebas si es más rápido', 'Agentes', on]
    ];
    return { reglas: lista.map((x, i) => r(x[0], x[1], x[2], i)) };
  }
}
</script>
</body>
</html>
