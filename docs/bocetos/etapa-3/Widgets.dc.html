<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Widgets en inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D4FAF}a:hover{color:#123A85}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #DCE3EE; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #1F2329; padding: 70px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px">
    <div style="height: 158px; background: #FFFFFF; border-radius: 22px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; font-weight: 600; color: #1D4FAF">TE ESPERAN</div>
      <div style="font-size: 48px; font-weight: 700; line-height: 1">2</div>
      <div style="font-size: 13px; color: #2B2F36; line-height: 1.3; margin-top: auto">SkyNest: permiso<br>visualizador: pregunta</div>
    </div>
    <div style="height: 158px; background: #FFFFFF; border-radius: 22px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 600; color: #4A505C">CONSUMO</div>
      <sc-for list="{{limites}}" as="l" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 13px"><span>{{l.t}}</span><span style="font-family: ui-monospace, 'SF Mono', monospace">{{l.v}}</span></div>
          <div style="height: 6px; border-radius: 3px; background: #E4E7EB; overflow: hidden"><div style="height: 6px; width: {{l.w}}; background: {{l.c}}"></div></div>
        </div>
      </sc-for>
      <div style="font-size: 11px; color: #4A505C; margin-top: auto">Personal · se renueva 18:40</div>
    </div>
  </div>
  <div style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #4A505C"><span>OFICINA</span><span>16:20</span></div>
    <sc-for list="{{agentes}}" as="a" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 14px">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{a.c}}; flex-shrink: 0"></span>
        <span style="font-weight: 600; width: 104px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.n}}</span>
        <span style="flex: 1; color: #2B2F36; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.e}}</span>
      </div>
    </sc-for>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 18px; padding: 4px 6px 0">
    <sc-for list="{{apps}}" as="p" hint-placeholder-count="8">
      <div style="aspect-ratio: 1; border-radius: 14px; background: #C3CCD9"></div>
    </sc-for>
  </div>
  <div style="font-size: 12px; color: #4A505C; text-align: center">Íconos grises: otras apps del iPhone</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      limites: [
        { t: '5 horas', v: '62 %', w: '62%', c: '#1D4FAF' },
        { t: 'Semana', v: '38 %', w: '38%', c: '#2B2F36' }
      ],
      agentes: [
        { n: 'SkyNest', e: 'Pide permiso', c: '#1D4FAF' },
        { n: 'visualizador', e: 'Espera tu decisión', c: '#8A3E0E' },
        { n: 'vive-demo', e: 'Atascado 18 min', c: '#9B2C1E' },
        { n: 'mi-proyecto', e: 'Trabajando 12 min', c: '#2F5C45' }
      ],
      apps: [1, 2, 3, 4, 5, 6, 7, 8].map((i) => ({ i }))
    };
  }
}
</script>
</body>
</html>
