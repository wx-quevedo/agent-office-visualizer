<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Oficina 3D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D4FAF}a:hover{color:#123A85}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #E9ECF1; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #1F2329; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 58px 16px 6px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 34px; font-weight: 700; letter-spacing: -0.01em">Oficina</div>
      <div style="font-size: 14px; color: #4A505C">5 trabajando · 2 te esperan · 1 atascado</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #D5D9DF; border-radius: 9px; padding: 2px; width: 120px">
      <a href="Main.dc.html" style="height: 32px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #2B2F36; text-decoration: none">Lista</a>
      <a href="Oficina3D.dc.html" style="height: 32px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #1F2329; text-decoration: none">3D</a>
    </div>
  </div>
  <div style="position: relative; height: 470px; flex-shrink: 0">
    <svg width="390" height="470" viewBox="0 0 390 470" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <polygon points="160,75 398,212 226,311 -12,174" fill="#F7F8FA" stroke="#D5D9DF" stroke-width="1"></polygon>
      <polygon points="-12,174 226,311 226,325 -12,188" fill="#D5D9DF"></polygon>
      <polygon points="226,311 398,212 398,226 226,325" fill="#C3C9D2"></polygon>
      <polygon points="160,75 398,212 398,140 160,3" fill="#EEF0F3" stroke="#D5D9DF" stroke-width="1"></polygon>
      <polygon points="186,40 260,83 260,113 186,70" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1"></polygon>
      <line x1="196" y1="56" x2="232" y2="77" stroke="#1D4FAF" stroke-width="3"></line>
      <line x1="196" y1="64" x2="248" y2="94" stroke="#9AA0AA" stroke-width="2"></line>
    </svg>
    <div style="position: absolute; left: 236px; top: 30px; font-size: 10px; color: #4A505C">Pizarra: Dónde quedamos</div>
    <sc-for list="{{puestos}}" as="p" hint-placeholder-count="6">
      <a href="{{p.href}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.left}}; top: {{p.top}}; width: 120px; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #1F2329">
        <span style="height: 24px; padding: 0 9px; border-radius: 12px; background: {{p.pillBg}}; color: {{p.pillFg}}; border: 1px solid {{p.pillBd}}; font-size: 11px; font-weight: 600; display: flex; align-items: center; white-space: nowrap">{{p.pill}}</span>
        <svg width="100" height="92" viewBox="0 0 100 92" aria-hidden="true" style="margin-top: 2px">
          <polygon points="50,30 95,56 50,82 5,56" fill="#FFFFFF" stroke="#C9CDD3" stroke-width="1"></polygon>
          <polygon points="5,56 50,82 50,92 5,66" fill="#C9CDD3"></polygon>
          <polygon points="50,82 95,56 95,66 50,92" fill="#AEB4BE"></polygon>
          <polygon points="58,40 78,52 78,38 58,26" fill="#2B2F36"></polygon>
          <polygon points="60,40 76,49 76,39 60,30" fill="{{p.pantalla}}"></polygon>
          <circle cx="36" cy="40" r="14" fill="{{p.cuerpo}}" stroke="{{p.anillo}}" stroke-width="3"></circle>
          <text x="36" y="44.5" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF" font-family="-apple-system, system-ui, sans-serif">{{p.ini}}</text>
        </svg>
      </a>
    </sc-for>
    <div style="position: absolute; right: 12px; top: 330px; display: flex; flex-direction: column; gap: 8px">
      <button aria-label="Centrar la vista" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D5D9DF; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="#2B2F36" stroke-width="1.7" fill="none"></circle><path d="M12 2v5M12 17v5M2 12h5M17 12h5" stroke="#2B2F36" stroke-width="1.7"></path></svg>
      </button>
      <button aria-label="Girar la vista" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D5D9DF; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v5h-5" stroke="#2B2F36" stroke-width="1.7" fill="none"></path></svg>
      </button>
    </div>
    <div style="position: absolute; left: 16px; top: 350px; font-size: 12px; color: #4A505C">Arrastra para girar · pellizca para acercar</div>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; bottom: 102px; background: #FFFFFF; border: 1px solid #9DB8EE; border-radius: 16px; overflow: hidden; z-index: 2">
    <div style="padding: 10px 14px 4px; font-size: 12px; font-weight: 700; color: #1D4FAF; letter-spacing: 0.03em">TE ESPERAN · 2</div>
    <a href="Ficha.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 14px; min-height: 44px; box-sizing: border-box; text-decoration: none; color: #1F2329">
      <span style="width: 9px; height: 9px; border-radius: 5px; background: #1D4FAF; flex-shrink: 0"></span>
      <span style="flex: 1; font-size: 14px"><strong>SkyNest</strong> · borrar carpeta de compilación</span>
      <span style="font-size: 12px; color: #4A505C">40 s</span>
    </a>
    <a href="Decisiones.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 14px 10px; min-height: 44px; box-sizing: border-box; text-decoration: none; color: #1F2329; border-top: 1px solid #EEF0F3">
      <span style="width: 9px; height: 9px; border-radius: 5px; background: #8A3E0E; flex-shrink: 0"></span>
      <span style="flex: 1; font-size: 14px"><strong>visualizador</strong> · elegir entre dos opciones</span>
      <span style="font-size: 12px; color: #4A505C">6 min</span>
    </a>
  </div>
  <nav aria-label="Secciones" style="position: absolute; left: 16px; right: 16px; bottom: 26px; height: 64px; border-radius: 32px; background: rgba(255,255,255,0.62); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 10px 30px rgba(31,35,41,0.14), inset 0 1px 0 rgba(255,255,255,0.9); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 4px; box-sizing: border-box; z-index: 3">
    <a href="Oficina3D.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #1D4FAF; font-size: 11px; font-weight: 600; border-radius: 28px; background: rgba(29,79,175,0.12)">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7" fill="none"></rect><path d="M8 21h8M12 18v3" stroke="currentColor" stroke-width="1.7"></path></svg>Oficina</a>
    <a href="Decisiones.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5A6170; font-size: 11px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="1.7" fill="none"></path></svg>Decisiones
      <span style="position: absolute; top: 4px; left: 56%; min-width: 18px; height: 18px; border-radius: 9px; background: #9B2C1E; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">3</span></a>
    <a href="Donde.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5A6170; font-size: 11px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z" stroke="currentColor" stroke-width="1.7" fill="none"></path><circle cx="12" cy="9.5" r="2.5" stroke="currentColor" stroke-width="1.7" fill="none"></circle></svg>Dónde quedamos</a>
    <a href="Ideas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5A6170; font-size: 11px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9V16h7v-2.1A6 6 0 0012 3z" stroke="currentColor" stroke-width="1.7" fill="none"></path></svg>Ideas</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pos = (i, j) => ({ x: 160 + 66 * i - 66 * j, y: 110 + 38 * i + 38 * j });
    const espera = (c) => ({ pillBg: c, pillFg: '#FFFFFF', pillBd: c, anillo: c });
    const normal = (c) => ({ pillBg: '#FFFFFF', pillFg: '#1F2329', pillBd: '#D5D9DF', anillo: c });
    const datos = [
      Object.assign({ i: 0, j: 1, ini: 'MV', pill: 'server-monitor · 12 min', pantalla: '#7FB79A', cuerpo: '#2B2F36' }, normal('#2F5C45')),
      Object.assign({ i: 0, j: 0, ini: 'SK', pill: 'SkyNest · Permiso', pantalla: '#9DB8EE', cuerpo: '#2B2F36' }, espera('#1D4FAF')),
      Object.assign({ i: 1, j: 1, ini: 'BZ', pill: 'Buscapez · Listo', pantalla: '#C9CDD3', cuerpo: '#5A6170' }, normal('#9AA0AA')),
      Object.assign({ i: 1, j: 0, ini: 'VA', pill: 'visualizador · Pregunta', pantalla: '#E8B98F', cuerpo: '#2B2F36' }, espera('#8A3E0E')),
      Object.assign({ i: 2, j: 1, ini: '', pill: 'Puesto libre', pantalla: '#E4E7EB', cuerpo: '#E4E7EB' }, { pillBg: '#F4F5F7', pillFg: '#4A505C', pillBd: '#D5D9DF', anillo: '#E4E7EB' }),
      Object.assign({ i: 2, j: 0, ini: 'VB', pill: 'vive-demo · Atascado', pantalla: '#E4A69C', cuerpo: '#2B2F36' }, espera('#9B2C1E'))
    ];
    const puestos = datos
      .sort((a, b) => (a.i + a.j) - (b.i + b.j))
      .map((d) => {
        const p = pos(d.i, d.j);
        return Object.assign({}, d, {
          left: (p.x - 60) + 'px',
          top: (p.y - 26) + 'px',
          href: d.ini ? 'Ficha.dc.html' : '#',
          aria: d.ini ? 'Abrir ficha de ' + d.pill : 'Puesto libre'
        });
      });
    return { puestos };
  }
}
</script>
</body>
</html>
