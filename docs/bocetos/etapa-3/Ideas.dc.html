<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ideas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D4FAF}a:hover{color:#123A85}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #F4F5F7; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #1F2329; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 58px 16px 4px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 34px; font-weight: 700; letter-spacing: -0.01em">Ideas</div>
    <div style="font-size: 15px; color: #4A505C">Anótala ahora, asígnala después.</div>
  </div>
  <div style="margin: 12px 16px 0; padding: 14px; background: #FFFFFF; border: 1px solid #D5D9DF; border-radius: 14px; display: flex; flex-direction: column; gap: 10px">
    <label for="idea" style="font-size: 13px; font-weight: 600; color: #4A505C">NUEVA IDEA</label>
    <textarea id="idea" rows="3" style="border: none; resize: none; font-family: inherit; font-size: 16px; line-height: 1.4; color: #1F2329; background: transparent; padding: 0">Que la ficha muestre cuánto falta para el límite de 5 horas</textarea>
    <div style="display: flex; gap: 8px; align-items: center">
      <button aria-label="Dictar" style="width: 50px; height: 50px; border-radius: 25px; border: none; background: #1D4FAF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" stroke="#FFFFFF" stroke-width="1.8" fill="none"></rect><path d="M5 11a7 7 0 0014 0M12 18v3" stroke="#FFFFFF" stroke-width="1.8" fill="none"></path></svg>
      </button>
      <label for="proyecto" style="position: absolute; left: -9999px">Proyecto</label>
      <select id="proyecto" style="flex: 1; height: 44px; border: 1px solid #D5D9DF; border-radius: 10px; padding: 0 10px; font-family: inherit; font-size: 15px; background: #FFFFFF; color: #1F2329">
        <option>visualizador-agentes</option>
        <option>SkyNest</option>
        <option>Sin proyecto todavía</option>
      </select>
      <button style="height: 44px; padding: 0 16px; border: none; border-radius: 10px; background: #2B2F36; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600">Guardar</button>
    </div>
  </div>
  <div style="padding: 18px 16px 8px; font-size: 13px; font-weight: 600; color: #4A505C">GUARDADAS · 4</div>
  <div style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{ideas}}" as="i" hint-placeholder-count="4">
      <div style="background: #FFFFFF; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 15px; line-height: 1.4">{{i.texto}}</div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px">
          <span style="padding: 3px 8px; border-radius: 5px; background: #EEF0F3; color: #2B2F36">{{i.proyecto}}</span>
          <span style="font-weight: 600; color: {{i.color}}">{{i.estado}}</span>
        </div>
      </div>
    </sc-for>
  </div>
  <nav aria-label="Secciones" style="position: absolute; left: 16px; right: 16px; bottom: 26px; height: 64px; border-radius: 32px; background: rgba(255,255,255,0.62); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 10px 30px rgba(31,35,41,0.14), inset 0 1px 0 rgba(255,255,255,0.9); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 4px; box-sizing: border-box; z-index: 3">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5A6170; font-size: 11px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7" fill="none"></rect><path d="M8 21h8M12 18v3" stroke="currentColor" stroke-width="1.7"></path></svg>Oficina</a>
    <a href="Decisiones.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5A6170; font-size: 11px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6" stroke="currentColor" stroke-width="1.7" fill="none"></path></svg>Decisiones
      <span style="position: absolute; top: 4px; left: 56%; min-width: 18px; height: 18px; border-radius: 9px; background: #9B2C1E; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">3</span></a>
    <a href="Donde.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5A6170; font-size: 11px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z" stroke="currentColor" stroke-width="1.7" fill="none"></path><circle cx="12" cy="9.5" r="2.5" stroke="currentColor" stroke-width="1.7" fill="none"></circle></svg>Dónde quedamos</a>
    <a href="Ideas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #1D4FAF; font-size: 11px; font-weight: 600; border-radius: 28px; background: rgba(29,79,175,0.12)">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9V16h7v-2.1A6 6 0 0012 3z" stroke="currentColor" stroke-width="1.7" fill="none"></path></svg>Ideas</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ideas: [
        { texto: 'Modo fiesta cuando todos los agentes terminan', proyecto: 'visualizador-agentes', estado: 'Etapa 8', color: '#4A505C' },
        { texto: 'Pasar un trabajo de un agente a otro sin perder el contexto', proyecto: 'visualizador-agentes', estado: 'Etapa 4', color: '#4A505C' },
        { texto: 'Probar la arena con 20 enemigos a la vez', proyecto: 'SkyNest', estado: 'Nueva', color: '#1D4FAF' },
        { texto: 'Revisar el diseño del correo de bienvenida', proyecto: 'Sin proyecto', estado: 'Sin asignar', color: '#8A3E0E' }
      ]
    };
  }
}
</script>
</body>
</html>
