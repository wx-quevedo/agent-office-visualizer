# Encabezados de seguridad de agents.example.com. Se incluye en cada location
# que agrega encabezados propios (en nginx un add_header dentro de un location
# anula los del server). Se instala en /etc/nginx/snippets/visualizador-agentes-seguridad.conf.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# El export de Next.js usa scripts y estilos en línea; three.js dibuja con
# texturas de canvas (data: y blob: en imágenes). Sin eval, sin wasm, sin workers
# y sin WebSocket: la oficina consulta /api por https.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
