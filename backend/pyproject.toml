[project]
name = "claude-office-visualizer"
version = "0.24.1"
description = "Real-time pixel art visualization of Claude Code operations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
    "sqlalchemy>=2.0.52",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "rich>=15.0.0",
    "greenlet>=3.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "pyright>=1.1.414",
    "pre-commit>=4.6.2",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = [
    "app",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]
timeout = 5

[tool.hatch.build.targets.wheel]
packages = [
    "app",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.7",
    "pre-commit>=4.6.2",
    # ARC-010: contract test imports hooks' event_mapper, which depends on
    # defusedxml for <task-notification> parsing. Test-only; not a runtime dep.
    "defusedxml>=0.7.1",
    # Stub-only peer dep for Starlette/FastAPI TestClient typing (pyright).
    # NOT unused: removing it makes `make typecheck` fail on TestClient.get/post
    # in the test suite. Kept intentionally. (Re-evaluates ARC-022's "unused" call.)
    "httpx2>=2.13.0",
]
