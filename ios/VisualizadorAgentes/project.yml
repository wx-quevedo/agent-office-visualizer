name: VisualizadorAgentes
options:
  bundleIdPrefix: com.inmersoft
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # El equipo se elige en Xcode (Personal Team): no se fija aquí.
    DEVELOPMENT_TEAM: ""
targets:
  VisualizadorAgentes:
    type: application
    platform: iOS
    sources:
      - path: VisualizadorAgentes
    info:
      path: VisualizadorAgentes/Info.plist
      properties:
        CFBundleDisplayName: Agentes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # El script "Número de build" lo reemplaza por la cantidad de commits de git.
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: es-419
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Face ID abre la app y confirma los permisos peligrosos.
        NSMicrophoneUsageDescription: El micrófono se usa solo mientras dictas una idea.
        NSSpeechRecognitionUsageDescription: El reconocimiento de voz de Apple convierte tu dictado en el texto de la idea. Si el iPhone lo permite, se hace en el propio iPhone.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inmersoft.visualizadoragentes
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # El script del número de build lee git (fuera del sandbox de scripts).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      # Antes de compilar: escribe en el Info.plist de origen (lo genera XcodeGen y no se
      # versiona) la cantidad de commits de git como número de build, solo si cambió.
      # Así Xcode procesa y firma el Info.plist con el número correcto, también en las
      # compilaciones incrementales.
      - name: Número de build
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/VisualizadorAgentes/Info.plist
        shell: /bin/sh
        script: |
          N=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          [ -n "$NUMERO_BUILD" ] && N="$NUMERO_BUILD"
          PLIST="$SRCROOT/VisualizadorAgentes/Info.plist"
          ACTUAL=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" 2>/dev/null)
          if [ "$ACTUAL" != "$N" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $N" "$PLIST"
          fi
          echo "Número de build: $N"
  VisualizadorAgentesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VisualizadorAgentesTests
    dependencies:
      - target: VisualizadorAgentes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inmersoft.visualizadoragentes.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  VisualizadorAgentes:
    build:
      targets:
        VisualizadorAgentes: all
        VisualizadorAgentesTests: [test]
    test:
      targets:
        - VisualizadorAgentesTests
