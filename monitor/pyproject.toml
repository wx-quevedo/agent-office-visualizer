[project]
name = "visualizador-monitor"
version = "0.6.0"
description = "Monitor de máquina de la oficina de agentes: recibe los hooks, lee transcripciones y procesos, y envía todo al servidor con su token"
requires-python = ">=3.13"
dependencies = [
    "claude-office-hooks",
]

[project.scripts]
visualizador-monitor = "visualizador_monitor.cli:main"

[tool.uv.sources]
claude-office-hooks = { path = "../hooks", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualizador_monitor"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# el guion de PowerShell de la tarea programada va en líneas largas
"src/visualizador_monitor/instalador.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
